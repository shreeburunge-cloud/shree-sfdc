<template>
    <lightning-card title="🛒 Product Store">

        <!-- Product Picklist -->
        <div class="slds-p-around_medium">
            <lightning-combobox label="Select Product" value={selectedProductId} options={productOptions}
                onchange={handleProductChange}>
            </lightning-combobox>
        </div>

        <!-- Product Grid -->
        <template if:true={selectedProduct}>
            <div class="product-card" onclick={handleImageClick}>
                <img src={selectedProduct.Image_URL__c} class={imageClass} />
                <div class="details">
                    <h2>{selectedProduct.Name}</h2>
                    <p>{selectedProduct.Description}</p>
                    <p class="price">$ {selectedProduct.Price__c}</p>
                </div>
            </div>
        </template>

        <!-- Modal -->
        <template if:true={showModal}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2>{selectedProduct.Name}</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Price: $ {selectedProduct.Price__c}</p>

                        <lightning-input type="number" label="Quantity" value={quantity} min="1"
                            onchange={handleQuantityChange}>
                        </lightning-input>

                        <p class="total-preview">
                            Total: $ {previewTotal}
                        </p>

                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>

                        <lightning-button variant="brand" label="Add To Cart" onclick={addToCart}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Cart Section -->
        <div class="cart-section slds-p-around_medium">
            <h3>Cart Items</h3>

            <template for:each={cartItems} for:item="item">
                <div key={item.id} class="cart-item">
                    <span>{item.name} (x{item.quantity})</span>
                    <span>$ {item.total}</span>

                    <lightning-button-icon icon-name="utility:delete" data-id={item.id} onclick={removeFromCart}>
                    </lightning-button-icon>
                </div>
            </template>

            <div class="grand-total">
                <p><b>Total Products: {totalProducts}</b></p>
                <p><b>Grand Total: $ {grandTotal}</b></p>
            </div>
        </div>

    </lightning-card>
</template>
