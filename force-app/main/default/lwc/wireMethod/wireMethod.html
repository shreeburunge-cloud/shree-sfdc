<!-- 
* Author : Shrikrishna Burunge
* Description : This Template is created for calling @wire method for getting account details 
-->
<template>
    <lightning-card title="ApexWireMethodToFunction" icon-name="custom:custom63">
      <div class="slds-m-around_medium">
        <template lwc:if={accData}>
          <template for:each={accData} for:item="data">
            <p key={data.Id}>{data.Name}</p>
          </template>
        </template>
        <template lwc:elseif={error}>
          <c-error-panel errors={error}></c-error-panel>
        </template>
      </div>
    </lightning-card>
  </template>
