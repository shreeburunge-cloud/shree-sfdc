<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_3-of-6" >
    <lightning-card title="Insert Person Details" icon-name="utility:contact">
        <p class="slds-var-p-around_small">
            <lightning-layout multiple-rows="true">
                    <lightning-layout-item padding="around_small" size="12" medium-device-size="6">
                        <lightning-input label="First Name" type="text" name="personfirstname" value={fnameval} class="inputFname" onchange={personHandleChange}></lightning-input>
                        <lightning-input label="Last Name" type="text" name="personlastname" value={lnameVal} class="inputLname" onchange={personHandleChange}></lightning-input>
                        </lightning-layout-item>
            </lightning-layout>
        </p>
        
        <p>
            <lightning-button class="slds-align_absolute-left slds-var-m-bottom_small" label="Submit" onclick={submitRecord}></lightning-button>
        </p>
    </lightning-card>
    </div>
    <div class="slds-col slds-size_3-of-6" >
            <lightning-card title="Display Person Details"> 
            <div style="height:400px">
                
                    
                    <lightning-button slot="actions" label="Delete Person" onclick={deletePersonRecord} ></lightning-button>
                    <lightning-datatable data={personList} columns={columns} key-field="Id" max-row-selection="1" onrowselection={handelSelection} >
                    </lightning-datatable>
                    
                    
            </div>
        </lightning-card>
     </div>
    </div>
</template>
